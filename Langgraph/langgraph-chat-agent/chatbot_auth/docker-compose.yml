version: '3.9'

services:
  db:
    image: ankane/pgvector
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    networks:
      - default
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - default
  
networks:
  default: