[project]
name = "langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.13",
    "docarray>=0.41.0",
    "google-genai>=1.20.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupyter-bokeh>=4.0.5",
    "langchain-google-genai>=2.1.5",
    "langchain-mcp-adapters>=0.1.8",
    "langgraph>=0.4.8",
    "mcp>=1.10.1",
    "panel>=1.7.1",
    "pypdf>=5.6.0",
    "tavily-python>=0.7.6",
    "tiktoken>=0.9.0",
    "youtube-transcript-api>=1.1.0",
]

[dependency-groups]
dev = [
    "langchain",
]

[tool.uv.sources]
langchain = { workspace = true }

[tool.uv.workspace]
members = [
    "Langgraph/hitl_design_patterns",
]
